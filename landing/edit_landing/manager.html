<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing Manager - StockTraders AI</title>
  <style>
    :root { color-scheme: dark; --bg:#090d15; --panel:#111827; --line:#273247; --text:#eef2ff; --muted:#8190ad; --green:#38d68c; --purple:#8b5cf6; --red:#ff4778; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; background: radial-gradient(circle at top left, rgba(139,92,246,.16), transparent 34%), var(--bg); color:var(--text); }
    main { width:min(1280px, calc(100vw - 32px)); margin:0 auto; padding:28px 0 40px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 0 22px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:28px; line-height:1.1; }
    .sub { margin-top:8px; color:var(--muted); font-size:14px; }
    .grid { display:grid; grid-template-columns:minmax(340px, 400px) minmax(0, 1fr); gap:18px; margin-top:22px; align-items:start; }
    .box { background:rgba(17,24,39,.9); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:0 24px 80px rgba(0,0,0,.25); }
    .create-box { position:sticky; top:18px; }
    .list-box { min-width:0; padding-bottom:12px; }
    label { display:block; margin:12px 0 6px; color:#8ea2c8; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; }
    input, select, textarea { width:100%; border:1px solid var(--line); border-radius:10px; background:#172033; color:var(--text); padding:11px 12px; font:inherit; outline:none; }
    textarea { min-height:160px; resize:vertical; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size:12px; line-height:1.45; }
    input:focus, select:focus, textarea:focus { border-color:var(--purple); box-shadow:0 0 0 3px rgba(139,92,246,.18); }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .actions { display:flex; gap:10px; align-items:center; margin-top:16px; flex-wrap:wrap; }
    button, .btn { border:1px solid rgba(56,214,140,.5); background:var(--green); color:#04120b; border-radius:10px; padding:10px 13px; font-weight:800; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; min-height:38px; white-space:nowrap; }
    .btn.sm, button.sm { min-height:34px; padding:7px 10px; border-radius:9px; font-size:13px; }
    button.secondary, .btn.secondary { background:#172033; color:var(--text); border-color:var(--line); }
    button.danger { color:var(--red); border-color:rgba(255,71,120,.45); }
    .msg { min-height:20px; margin-top:12px; color:var(--muted); font-size:13px; }
    .msg.err { color:var(--red); }
    .landing-table-wrap { max-height:calc(100vh - 220px); min-height:280px; overflow:auto; padding-right:4px; }
    table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:14px; }
    th, td { padding:12px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
    th { color:#8ea2c8; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    thead th { position:sticky; top:0; z-index:1; background:#111827; }
    th.url-col { width:34%; }
    th.name-col { width:30%; }
    th.leads-col { width:80px; }
    th.action-col { width:230px; }
    td code { color:var(--green); background:rgba(56,214,140,.08); padding:4px 7px; border-radius:7px; white-space:nowrap; }
    .truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .landing-actions { display:flex; gap:8px; justify-content:flex-end; align-items:center; flex-wrap:nowrap; }
    .empty { padding:30px; color:var(--muted); text-align:center; border:1px dashed var(--line); border-radius:12px; }
    .hidden { display:none; }
    @media (max-width: 1100px) {
      .grid { grid-template-columns:1fr; }
      .create-box { position:static; }
      .landing-table-wrap { max-height:none; }
    }
    @media (max-width: 720px) {
      main { width:min(100vw - 20px, 1280px); padding-top:18px; }
      header { align-items:flex-start; flex-direction:column; }
      th.name-col, td.name-cell { display:none; }
      th.url-col { width:auto; }
      th.action-col { width:168px; }
      .landing-actions { gap:6px; }
      .btn.sm, button.sm { padding:7px 8px; font-size:12px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Quản lý landing</h1>
        <div class="sub">Tạo URL mới như <strong>/tri-an/</strong>, <strong>/khach-hang/</strong>. Mỗi landing có DB, form và HTML riêng.</div>
      </div>
      <a class="btn secondary" href="/1/">Mở /1/</a>
    </header>

    <div class="grid">
      <section class="box create-box">
        <h2 style="margin:0 0 4px;font-size:18px">Tạo landing mới</h2>
        <div class="sub">Không có chức năng đặt mặc định cho /.</div>

        <label for="pin">PIN admin</label>
        <input id="pin" type="password" placeholder="Nhập PIN">

        <label for="title">Tên landing</label>
        <input id="title" type="text" placeholder="Ví dụ: Tri ân khách hàng">

        <label for="slug">Slug URL</label>
        <input id="slug" type="text" placeholder="tri-an">

        <label for="source">Mẫu khởi tạo</label>
        <select id="source">
          <option value="default">Mẫu mặc định</option>
          <option value="copy">Copy từ landing có sẵn</option>
          <option value="html">Dán HTML mới</option>
        </select>

        <div id="copy-wrap" class="hidden">
          <label for="copy-from">Copy từ</label>
          <select id="copy-from"></select>
        </div>

        <div id="html-wrap" class="hidden">
          <label for="html">HTML ban đầu</label>
          <textarea id="html" spellcheck="false" placeholder="Dán HTML public landing ở đây..."></textarea>
        </div>

        <div class="actions">
          <button type="button" id="create-btn">Tạo landing</button>
          <button type="button" class="secondary" id="reload-btn">Làm mới</button>
        </div>
        <div id="msg" class="msg"></div>
      </section>

      <section class="box list-box">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px">
          <h2 style="margin:0;font-size:18px">Danh sách landing</h2>
          <span id="count" class="sub"></span>
        </div>
        <div id="list"></div>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const slugInput = $("slug");
    const titleInput = $("title");
    const sourceInput = $("source");
    const msg = $("msg");
    let landings = [];

    function slugify(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .toLowerCase()
        .replace(/[^a-z0-9-]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .replace(/-+/g, "-")
        .slice(0, 64);
    }

    titleInput.addEventListener("input", () => {
      if (!slugInput.dataset.touched) slugInput.value = slugify(titleInput.value);
    });
    slugInput.addEventListener("input", () => {
      slugInput.dataset.touched = "1";
      slugInput.value = slugify(slugInput.value);
    });
    sourceInput.addEventListener("change", syncSourceControls);
    $("reload-btn").addEventListener("click", loadLandings);
    $("create-btn").addEventListener("click", createLanding);

    function syncSourceControls() {
      $("copy-wrap").classList.toggle("hidden", sourceInput.value !== "copy");
      $("html-wrap").classList.toggle("hidden", sourceInput.value !== "html");
    }

    function setMessage(text, isError = false) {
      msg.textContent = text || "";
      msg.className = isError ? "msg err" : "msg";
    }

    async function requestJson(url, options = {}) {
      const res = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function renderLandings() {
      $("count").textContent = landings.length + " landing";
      const copy = $("copy-from");
      copy.innerHTML = landings.filter((item) => !item.system).map((item) => `<option value="${item.slug}">/${item.slug}/</option>`).join("");
      if (!landings.length) {
        $("list").innerHTML = '<div class="empty">Chua co landing nao.</div>';
        return;
      }
      $("list").innerHTML = `
        <div class="landing-table-wrap">
          <table>
            <thead><tr><th class="url-col">URL</th><th class="name-col">T&ecirc;n</th><th class="leads-col">Leads</th><th class="action-col"></th></tr></thead>
            <tbody>
              ${landings.map((item) => `
                <tr>
                  <td class="truncate"><code>/${item.slug}/</code></td>
                  <td class="name-cell truncate" title="${escapeHtml(item.title || item.slug)}">${escapeHtml(item.title || item.slug)}</td>
                  <td>${item.system ? "-" : (item.leads || 0)}</td>
                  <td>
                    <div class="landing-actions">
                      <a class="btn secondary sm" href="/${item.slug}/">M&#7903;</a>
                      ${item.protected ? "" : `<button type="button" class="secondary sm" onclick="editLanding('${escapeJs(item.slug)}', '${escapeJs(item.title || item.slug)}')">S&#7917;a URL</button><button type="button" class="secondary danger sm" onclick="deleteLanding('${escapeJs(item.slug)}')">X&oacute;a</button>`}
                    </div>
                  </td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>`;
    }
    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }


    function escapeJs(value) {
      return String(value || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }
    async function loadLandings() {
      try {
        const data = await requestJson("/api/landings");
        landings = Array.isArray(data.landings) ? data.landings : [];
        renderLandings();
        setMessage("");
      } catch (err) {
        setMessage(err.message || "Không tải được danh sách landing.", true);
      }
    }


    async function editLanding(slug, currentTitle) {
      const pin = $("pin").value.trim();
      if (!pin) {
        setMessage("Nhập PIN trước khi sửa URL.", true);
        return;
      }
      const nextSlugRaw = prompt(`Slug mới cho /${slug}/`, slug);
      if (nextSlugRaw === null) return;
      const nextSlug = slugify(nextSlugRaw);
      if (!nextSlug) {
        setMessage("Slug mới không hợp lệ.", true);
        return;
      }
      const nextTitle = prompt("Tên landing", currentTitle || nextSlug);
      if (nextTitle === null) return;
      if (nextSlug !== slug && !confirm(`Đổi /${slug}/ thành /${nextSlug}/? DB/leads sẽ được giữ nguyên.`)) return;
      try {
        const data = await requestJson(`/api/landings/${encodeURIComponent(slug)}`, {
          method: "PATCH",
          body: JSON.stringify({ pin, slug: nextSlug, title: nextTitle.trim() || nextSlug }),
        });
        await loadLandings();
        setMessage(`Đã cập nhật thành /${data.landing.slug}/.`);
      } catch (err) {
        setMessage(err.message || "Không sửa được URL landing.", true);
      }
    }
    async function deleteLanding(slug) {
      const pin = $("pin").value.trim();
      if (!pin) {
        setMessage("Nhập PIN trước khi xóa.", true);
        return;
      }
      if (!confirm(`Xóa landing /${slug}/ và toàn bộ DB/leads của landing này?`)) return;
      try {
        await requestJson(`/api/landings/${encodeURIComponent(slug)}`, {
          method: "DELETE",
          body: JSON.stringify({ pin }),
        });
        await loadLandings();
        setMessage(`Đã xóa /${slug}/.`);
      } catch (err) {
        setMessage(err.message || "Không xóa được landing.", true);
      }
    }

    // Giống hệt logic "Thay HTML" (mode replace) ở Chế độ sửa UI trong index.html,
    // để landing tạo mới qua đây và landing sửa qua "Thay HTML" luôn ra kết quả đồng nhất.
    function findMatchingBrace(css, openIndex) {
      let depth = 0;
      for (let i = openIndex; i < css.length; i += 1) {
        if (css[i] === "{") depth += 1;
        if (css[i] === "}") {
          depth -= 1;
          if (depth === 0) return i;
        }
      }
      return -1;
    }

    function scopeCssSelector(selector, scopeSelector) {
      const trimmed = selector.trim();
      if (!trimmed) return "";
      if (trimmed.startsWith(scopeSelector)) return trimmed;
      if (trimmed === "*") return scopeSelector + " *";
      if (/^(html|body|:root)(\b|(?=[.#:\[]|$))/i.test(trimmed)) {
        return trimmed.replace(/^(html|body|:root)/i, scopeSelector);
      }
      return scopeSelector + " " + trimmed;
    }

    function splitCssSelectors(selectorText) {
      const selectors = [];
      let current = "";
      let depth = 0;
      for (const ch of selectorText) {
        if (ch === "(" || ch === "[") depth += 1;
        if (ch === ")" || ch === "]") depth = Math.max(0, depth - 1);
        if (ch === "," && depth === 0) {
          selectors.push(current);
          current = "";
        } else {
          current += ch;
        }
      }
      if (current.trim()) selectors.push(current);
      return selectors;
    }

    function scopeCss(css, scopeSelector) {
      let source = String(css || "").replace(/\/\*[\s\S]*?\*\//g, "");
      let output = "";
      let i = 0;

      while (i < source.length) {
        const nextOpen = source.indexOf("{", i);
        if (nextOpen === -1) {
          output += source.slice(i);
          break;
        }

        const head = source.slice(i, nextOpen).trim();
        const close = findMatchingBrace(source, nextOpen);
        if (close === -1) break;
        const body = source.slice(nextOpen + 1, close);

        if (!head) {
          i = close + 1;
          continue;
        }

        if (/^@media/i.test(head) || /^@supports/i.test(head)) {
          output += `${head}{${scopeCss(body, scopeSelector)}}`;
        } else if (/^@(keyframes|font-face|import|charset|property)/i.test(head)) {
          output += `${head}{${body}}`;
        } else if (head.startsWith("@")) {
          output += `${head}{${body}}`;
        } else {
          const scopedSelectors = splitCssSelectors(head)
            .map((selector) => scopeCssSelector(selector, scopeSelector))
            .filter(Boolean)
            .join(", ");
          if (scopedSelectors) output += `${scopedSelectors}{${body}}`;
        }
        i = close + 1;
      }

      return output;
    }

    function removePublicAdminPanels(root) {
      if (!root?.querySelectorAll) return;
      root.querySelectorAll([
        "#admin-panel",
        "#admin-login",
        "#admin-dash",
        "#admin-table",
        "[id^='admin-']",
        "[class*='admin' i]",
        "[data-admin]"
      ].join(",")).forEach((el) => el.remove());

      root.querySelectorAll("section, div, table").forEach((el) => {
        const text = (el.textContent || "").replace(/\s+/g, " ").trim();
        if (/Danh sách (khách|đăng ký)|Xuất CSV|Mã PIN|PIN chỉ dùng|admin/i.test(text)) {
          const hasLeadTable = /Thời gian.*Họ tên.*(SĐT|Số điện thoại)/i.test(text);
          if (hasLeadTable || /Xuất CSV|Mã PIN|PIN chỉ dùng|admin/i.test(text)) el.remove();
        }
      });
    }

    function removeInlineHandlers(root) {
      if (!root?.querySelectorAll) return;
      root.querySelectorAll("*").forEach((el) => {
        Array.from(el.attributes || []).forEach((attr) => {
          const name = attr.name.toLowerCase();
          const value = String(attr.value || "").trim().toLowerCase();
          if (name.startsWith("on")) el.removeAttribute(attr.name);
          if ((name === "href" || name === "src") && value.startsWith("javascript:")) {
            el.setAttribute(attr.name, "#");
          }
        });
      });
    }

    function extractDefaultLogoSrc(rawHtml) {
      const match = String(rawHtml || "").match(/const\s+DEFAULT_LOGO\s*=\s*(['"])(data:image\/[^'"]+)\1/);
      return match?.[2] || "";
    }

    function materializeTemplateLogos(root, rawHtml = "") {
      if (!root?.querySelectorAll) return;
      const defaultLogo = extractDefaultLogoSrc(rawHtml);
      const template = root.querySelector("template#logo-svg");
      root.querySelectorAll(".logo-slot").forEach((slot) => {
        if (slot.children.length || slot.textContent.trim()) return;
        if (defaultLogo) {
          const img = document.createElement("img");
          img.className = "logo";
          img.src = defaultLogo;
          img.alt = "StockTraders";
          slot.appendChild(img);
          slot.closest(".brand")?.classList.add("has-custom");
          return;
        }
        const logo = template?.content?.firstElementChild?.cloneNode(true);
        if (logo) slot.appendChild(logo);
      });
    }

    function cssDefinesSelectorProperty(css, selectorToken, property) {
      const source = String(css || "").replace(/\/\*[\s\S]*?\*\//g, "");
      const escaped = property.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const propRe = new RegExp(`(^|[;\\s])${escaped}\\s*:`, "i");
      let i = 0;
      while (i < source.length) {
        const open = source.indexOf("{", i);
        if (open === -1) return false;
        const close = findMatchingBrace(source, open);
        if (close === -1) return false;
        const head = source.slice(i, open);
        const body = source.slice(open + 1, close);
        if (!head.trim().startsWith("@") && head.includes(selectorToken) && propRe.test(body)) return true;
        i = close + 1;
      }
      return false;
    }

    function inheritedHeroReset(css, scopeSelector) {
      const resetProps = {
        "min-height": "auto",
        "display": "block",
        "flex-direction": "initial",
        "align-items": "initial",
        "justify-content": "initial",
        "text-align": "initial",
        "overflow": "visible"
      };
      const rules = Object.entries(resetProps)
        .filter(([property]) => !cssDefinesSelectorProperty(css, ".hero", property))
        .map(([property, value]) => `${property}:${value}!important;`);
      return rules.length ? `${scopeSelector} .hero{${rules.join("")}}` : "";
    }

    function extractHtmlForEditableArea(rawHtml, mode = "append") {
      const parser = new DOMParser();
      const doc = parser.parseFromString(rawHtml, "text/html");
      const hasDocumentShell = /<!doctype|<html[\s>]|<head[\s>]|<body[\s>]/i.test(rawHtml);
      const styles = [];
      let container;

      if (hasDocumentShell) {
        doc.querySelectorAll("style").forEach((style) => styles.push(style.textContent || ""));
        container = doc.body || doc.documentElement;
      } else {
        container = document.createElement("div");
        container.innerHTML = rawHtml;
        container.querySelectorAll("style").forEach((style) => {
          styles.push(style.textContent || "");
          style.remove();
        });
      }

      materializeTemplateLogos(container, rawHtml);
      container.querySelectorAll("script, meta, title, base").forEach((el) => el.remove());
      removePublicAdminPanels(container);
      removeInlineHandlers(container);
      const bodyHtml = container.innerHTML.trim();

      if (mode === "replace") {
        const scopeSelector = "#editable-area";
        const sourceCss = styles.join("\n");
        const scopedCss = sourceCss ? scopeCss(sourceCss, scopeSelector) : "";
        const layoutGuard = `${scopeSelector}{width:100%!important;max-width:none!important;margin:0!important;} ${scopeSelector} .reveal{opacity:1!important;transform:none!important;} ${scopeSelector} > nav{max-width:none!important;} ${scopeSelector} img, ${scopeSelector} video, ${scopeSelector} canvas, ${scopeSelector} svg{max-width:100%;}${inheritedHeroReset(sourceCss, scopeSelector)}`;
        const scopedStyle = scopedCss ? `<style>${scopedCss}${layoutGuard}</style>` : `<style>${layoutGuard}</style>`;
        return `${scopedStyle}${bodyHtml}`;
      }

      const scopeClass = "pasted-ui-" + Date.now().toString(36);
      const scopeSelector = "." + scopeClass + " .pasted-document";
      const scopedCss = styles.length ? scopeCss(styles.join("\n"), scopeSelector) : "";
      const layoutGuard = `${scopeSelector}{min-height:auto!important;width:100%!important;max-width:none!important;} ${scopeSelector} .reveal{opacity:1!important;transform:none!important;} ${scopeSelector} img, ${scopeSelector} video, ${scopeSelector} canvas, ${scopeSelector} svg{max-width:100%;}`;
      const scopedStyle = `<style>${scopedCss}${layoutGuard}</style>`;
      return `<section class="custom-pasted-section ${scopeClass}">${scopedStyle}<div class="pasted-document">${bodyHtml}</div></section>`;
    }

    function cssEscape(value) {
      return String(value || "").replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    }

    function normalizeVietnameseKey(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .toLowerCase()
        .replace(/[^a-z0-9_]+/g, "_")
        .replace(/^_+|_+$/g, "")
        .slice(0, 40) || "field";
    }

    function textForFieldGuess(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .toLowerCase();
    }

    function inferCanonicalKey(label, el) {
      const haystack = textForFieldGuess([label, el?.name, el?.id, el?.placeholder, el?.type].join(" "));
      if (/email|e_mail|mail/.test(haystack)) return "email";
      if (/phone|tel|sdt|so_dien_thoai|dien thoai/.test(haystack)) return "phone";
      if (/full.?name|name|ho va ten|ho ten|ten khach/.test(haystack)) return "name";
      if (/capital|investment|amount|budget|von dau tu|so von|von/.test(haystack)) return "capital";
      return normalizeVietnameseKey(label || el?.name || el?.id || el?.placeholder);
    }

    function cleanFieldLabel(value) {
      return String(value || "")
        .replace(/[*:：]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function labelForInput(el, root = document) {
      if (!el) return "";
      if (el.id) {
        const direct = root.querySelector?.(`label[for="${cssEscape(el.id)}"]`);
        if (direct?.textContent) return cleanFieldLabel(direct.textContent);
      }
      const wrapperLabel = el.closest("label");
      if (wrapperLabel?.textContent) {
        return cleanFieldLabel(wrapperLabel.textContent.replace(el.value || "", ""));
      }
      const row = el.closest(".form-row, [data-form-row], .field, .input-group, div, p");
      const rowLabel = row?.querySelector?.("label, .form-label, .label, [class*='label' i]");
      if (rowLabel?.textContent) return cleanFieldLabel(rowLabel.textContent);
      let prev = el.previousElementSibling;
      while (prev) {
        if (/^(label|span|div|p)$/i.test(prev.tagName) && cleanFieldLabel(prev.textContent)) {
          return cleanFieldLabel(prev.textContent);
        }
        prev = prev.previousElementSibling;
      }
      return cleanFieldLabel(el.getAttribute("aria-label") || el.placeholder || el.name || el.id);
    }

    function inferInputType(el) {
      if (!el) return "text";
      const tag = el.tagName?.toLowerCase();
      if (tag === "textarea") return "textarea";
      if (tag === "select") return "select";
      const type = (el.type || "text").toLowerCase();
      if (["tel", "email", "number", "date"].includes(type)) return type;
      return "text";
    }

    function extractSelectOptions(el) {
      if (el?.tagName?.toLowerCase() !== "select") return [];
      return Array.from(el.options || [])
        .filter((opt) => opt.value)
        .map((opt) => (opt.textContent || opt.value || "").trim())
        .filter(Boolean);
    }

    function getLeadFormContainer(root = document) {
      const scope = root || document;
      const submitSelector = "#form-submit-btn, button[type='submit'], input[type='submit'], .form-submit, .signup-btn";
      const buttons = Array.from(scope.querySelectorAll?.(submitSelector) || []);
      for (const button of buttons) {
        const container = button.closest("form, .form-box, .signup-box, .form-section, section, div");
        if (container?.querySelector?.("input:not([type='hidden']), textarea, select")) return container;
      }
      const form = scope.querySelector?.("form");
      if (form) return form;
      const firstInput = scope.querySelector?.("input:not([type='hidden']), textarea, select");
      return firstInput?.closest("form, .form-box, .signup-box, .form-section, section, div") || scope;
    }

    function detectFormFieldsFromRoot(root = document) {
      const container = getLeadFormContainer(root);
      if (!container?.querySelectorAll) return [];
      const controls = Array.from(container.querySelectorAll("input, textarea, select"))
        .filter((el) => !el.disabled && !["hidden", "submit", "button", "checkbox", "radio", "file"].includes((el.type || "").toLowerCase()));
      const seen = new Set();
      return controls.map((el, index) => {
        const label = labelForInput(el, container);
        const key = inferCanonicalKey(label, el);
        const type = inferInputType(el);
        const field = {
          key,
          label: label || `Trường ${index + 1}`,
          type,
          placeholder: el.placeholder || "",
          required: !!el.required || /\*/.test(labelForInput(el, container)),
          position: (index + 1) * 10,
          options: type === "select" ? extractSelectOptions(el) : undefined,
        };
        return field;
      }).filter((field) => {
        if (!field.label || seen.has(field.key)) return false;
        if (field.type === "select" && !field.options.length) return false;
        seen.add(field.key);
        return true;
      });
    }

    async function createLanding() {
      let html = $("html").value;
      let detectedFields = [];
      if (sourceInput.value === "html" && html.trim()) {
        html = extractHtmlForEditableArea(html, "replace");
        const scratch = document.createElement("div");
        scratch.innerHTML = html;
        detectedFields = detectFormFieldsFromRoot(scratch);
      }
      const payload = {
        pin: $("pin").value.trim(),
        title: titleInput.value.trim(),
        slug: slugInput.value.trim(),
        source: sourceInput.value,
        copy_from: $("copy-from").value,
        html,
      };
      if (!payload.pin || !payload.slug) {
        setMessage("Nhập PIN và slug trước.", true);
        return;
      }
      try {
        const data = await requestJson("/api/landings", {
          method: "POST",
          body: JSON.stringify(payload),
        });
        if (detectedFields.length) {
          await requestJson(`/${encodeURIComponent(data.landing.slug)}/api/form-fields`, {
            method: "PUT",
            body: JSON.stringify({ fields: detectedFields }),
          });
        }
        await loadLandings();
        setMessage(`Đã tạo /${data.landing.slug}/. Mở landing đó để sửa HTML/form như bình thường.`);
      } catch (err) {
        setMessage(err.message || "Không tạo được landing.", true);
      }
    }

    syncSourceControls();
    loadLandings();
  </script>
</body>
</html>
